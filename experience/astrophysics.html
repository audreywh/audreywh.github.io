        <h2>Overview</h2>
        <p>As a Nexus Scholar in the Cornell Extreme Astrophysics Group, I built a validated catalogue of fast radio bursts (FRBs) and used it to test how their radio pulses are dispersed and scattered on the way to Earth.</p>
