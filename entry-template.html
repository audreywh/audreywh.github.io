<!doctype html>
<!--
  DETAIL PAGE TEMPLATE
  1. Copy this file into experience/ or projects/ and rename it to <slug>.html
     (the same slug you used in assets/js/data.js).
  2. Set data-page ("experience" or "projects") and data-entry (the slug) on <body>.
  3. Update the <title> and description, then write your sections below.
  The title, role, dates, facts sidebar, highlights, and previous/next links
  are filled in automatically from data.js.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}} · Audrey Horn</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-root="../" data-page="{{PAGE}}" data-entry="{{SLUG}}">
  <header id="site-nav"></header>

  <main class="wrap">
    <div class="page-head" id="entry-head"></div>
    <div class="entry-grid">
      <article class="prose">
        <h2>Overview</h2>
        {{OVERVIEW}}

        <h2>Highlights</h2>
        <div data-bullets></div>

        <figure class="fig">
          <!-- To add a photo: put it in assets/img/ and replace the div below with
               <img src="../assets/img/your-photo.jpg" alt="Describe the photo"> -->
          <div class="ph">{{FIGURE}}</div>
          <figcaption>{{CAPTION}}</figcaption>
        </figure>

        <!-- Optional sections: uncomment and write as much as you like.
        <h2>The challenge</h2>
        <p></p>

        <h2>What I learned</h2>
        <p></p>
        -->
      </article>
      <aside class="facts" id="entry-facts"></aside>
    </div>
    <nav class="pn" id="entry-pn" aria-label="More entries"></nav>
  </main>

  <footer id="site-footer"></footer>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/site.js"></script>
</body>
</html>
